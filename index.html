<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Fluent by Fall</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="icon" href="icon.png" />
    <meta name="theme-color" content="#0b6e4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fluent by Fall" />
    <style>
      :root {
        --bg: #f7f6f2;
        --surface: #ffffff;
        --text: #1d1d1b;
        --muted: #5f5e58;
        --border: #d9d6cc;
        --accent: #0b6e4f;
        --accent-text: #ffffff;
        --warn-bg: #fdf3e1;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151514;
          --surface: #1f1f1d;
          --text: #ecebe6;
          --muted: #a9a79e;
          --border: #3a3935;
          --accent: #3fb68b;
          --accent-text: #0d1f18;
          --warn-bg: #3a2c14;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 16px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
        font-size: 0.9rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        font: inherit;
        color: inherit;
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
      }
      button,
      a.button {
        display: inline-block;
        font: inherit;
        font-weight: 600;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        padding: 10px 16px;
        margin: 0 8px 8px 0;
        cursor: pointer;
        text-decoration: none;
      }
      .primary {
        background: var(--accent) !important;
        border-color: var(--accent) !important;
        color: var(--accent-text) !important;
      }
      .warn {
        background: var(--warn-bg);
        border-radius: 8px;
        padding: 8px 12px;
      }
      .hidden {
        display: none !important;
      }
      .bar {
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
        margin: 8px 0 12px;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Fluent by Fall</h1>
        <p id="status" role="status" aria-live="polite">載入中…</p>
        <div id="progress" class="bar hidden" aria-hidden="true"><span id="progress-bar"></span></div>

        <form id="unlock" class="hidden">
          <label for="passphrase">密語</label>
          <input
            id="passphrase"
            type="password"
            autocomplete="current-password"
            autocapitalize="off"
            spellcheck="false"
            placeholder="五個英文單字"
            required
          />
          <button type="submit" class="primary">解鎖這台裝置</button>
        </form>

        <div id="actions" class="hidden">
          <a id="enter" class="button primary" href="app/index.html">進入練習</a>
          <button id="refresh" type="button">重新下載全部</button>
          <button id="logout" type="button">這台裝置登出</button>
        </div>

        <p class="muted">這是私人練習頁的入口。內容和進度存放在私人的地方，要輸入密語才能讀取。</p>
      </div>
    </main>
    <script src="sync-core.js"></script>
    <script src="gate.js"></script>
  </body>
</html>
